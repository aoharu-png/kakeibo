<title>ポケット家計簿</title>
<meta name="theme-color" content="#2f4b8f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap">
<style>
/* Layout: one phone-width ledger column; ruled notebook list, bottom action bar, bottom sheets for forms */
:root {
  --paper: #eef0f3;
  --sheet: #ffffff;
  --ink: #1c2230;
  --muted: #646d80;
  --rule: #d8dce5;
  --ai: #2f4b8f;
  --ai-soft: #e3e9f6;
  --shu: #b8402c;
  --good: #2c7a57;
  --shadow: 0 1px 2px rgb(20 30 60 / .06), 0 8px 24px rgb(20 30 60 / .08);
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
  --f-num: "Zen Old Mincho", "Hiragino Mincho ProN", "Noto Serif JP", "Noto Serif CJK JP", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141b; --sheet: #191e28; --ink: #e6e9f0; --muted: #959eb2; --rule: #2b3241;
    --ai: #93aaea; --ai-soft: #222c44; --shu: #ef8370; --good: #6cc39a;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141b; --sheet: #191e28; --ink: #e6e9f0; --muted: #959eb2; --rule: #2b3241;
  --ai: #93aaea; --ai-soft: #222c44; --shu: #ef8370; --good: #6cc39a;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 120px; display: grid; gap: 16px; }

/* month header */
.top { display: flex; align-items: center; gap: 8px; }
.top h1 { margin: 0; flex: 1; text-align: center; font: 700 22px/1.2 var(--f-num); letter-spacing: .02em; }
.top h1 small { display: block; font: 500 11px/1.4 var(--f-body); color: var(--muted); letter-spacing: .08em; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); }
.icon-btn:hover { background: var(--ai-soft); }
.icon-btn svg { width: 22px; height: 22px; }

/* summary */
.summary { background: var(--sheet); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 18px 16px; display: grid; gap: 14px; }
.label { font-size: 11px; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
.spent { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.spent .big { font-size: 36px; font-weight: 700; line-height: 1.1; }
.spent .big span { font-size: 16px; margin-left: 2px; }
.trio { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; border-top: 1px solid var(--rule); padding-top: 12px; }
.trio div { display: grid; gap: 2px; }
.trio .v { font-size: 18px; font-weight: 700; }
.pos { color: var(--good); } .neg { color: var(--shu); }
.meter { display: grid; gap: 6px; }
.bar { height: 8px; border-radius: 4px; background: var(--ai-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ai); border-radius: 4px; transition: width .4s; }
.bar.over i { background: var(--shu); }
.meter-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.link { background: none; border: 0; padding: 0; color: var(--ai); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }

/* categories */
.section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px -6px; }
.section-h h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.cats { display: grid; gap: 10px; background: var(--sheet); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
.cat-row { display: grid; grid-template-columns: 4.5em 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.cat-row .bar { height: 6px; }
.cat-row .amt { font-size: 14px; min-width: 5.5em; text-align: right; }

/* ledger list */
.ledger { background: var(--sheet); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.day { border-top: 1px solid var(--rule); }
.day:first-child { border-top: 0; }
.day-h { display: flex; justify-content: space-between; padding: 10px 18px 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.day-h .sun { color: var(--shu); } .day-h .sat { color: var(--ai); }
.row { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 18px; border: 0; background: none; text-align: left;
  background-image: linear-gradient(var(--rule), var(--rule)); background-size: calc(100% - 36px) 1px; background-position: 18px 100%; background-repeat: no-repeat; }
.row:last-child { background-image: none; }
.row:hover { background-color: var(--ai-soft); }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--ai-soft); color: var(--ai); font-weight: 700; white-space: nowrap; }
.chip.in { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.row .what { min-width: 0; }
.row .what b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .what small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-size: 17px; font-weight: 700; }
.row .amt.in { color: var(--good); }
.tag-r { font-size: 10px; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }
.empty { padding: 32px 22px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty strong { color: var(--ink); font-size: 16px; }

.notice { background: var(--ai-soft); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 13px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.notice button { border: 1px solid var(--ai); background: var(--sheet); color: var(--ai); border-radius: 8px; padding: 4px 12px; font-weight: 700; font-size: 13px; }

/* bottom bar */
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--paper) 30%); }
.dock-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
@media (max-width: 420px) { .dock .btn { padding: 14px 12px; font-size: 14px; } .dock .btn svg { display: none; } #scanBtn svg { display: inline; } }
.btn { border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--ai); color: var(--sheet); box-shadow: var(--shadow); }
.btn.ghost { background: var(--sheet); color: var(--ai); box-shadow: var(--shadow); }
.btn.danger { background: transparent; color: var(--shu); border: 1px solid var(--shu); }
.btn.plain { background: transparent; color: var(--muted); }
.btn:disabled { opacity: .5; }
label.btn { cursor: pointer; user-select: none; -webkit-user-select: none; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); pointer-events: none; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgb(10 14 24 / .45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.panel { background: var(--sheet); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 8px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .6 } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none } .bar i { transition: none } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--rule); justify-self: center; }
.panel h3 { margin: 0; font-size: 17px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 8px; border-radius: 8px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: var(--shadow); }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; display: flex; gap: 8px; align-items: center; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 10px 12px; }
.field textarea { min-height: 120px; font-size: 12px; font-family: ui-monospace, monospace; }
.amount-in { display: flex; align-items: center; border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; padding-inline: 12px; }
.amount-in span { font: 700 20px var(--f-num); color: var(--muted); }
.amount-in input { border: 0; background: none; font: 700 26px var(--f-num); padding: 8px 6px; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.auto { font-size: 10px; background: var(--ai-soft); color: var(--ai); border-radius: 4px; padding: 0 5px; font-weight: 700; }
.catpick { display: flex; flex-wrap: wrap; gap: 6px; }
.catpick button { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.catpick button[aria-pressed="true"] { border-color: var(--ai); background: var(--ai); color: var(--sheet); font-weight: 700; }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.actions .grow { margin-right: auto; }
.scan { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; background: var(--paper); border-radius: 12px; padding: 10px; }
.scan img { width: 72px; height: 96px; object-fit: cover; border-radius: 6px; background: var(--rule); }
.scan .msg { font-size: 13px; display: grid; gap: 6px; }
.warn { color: var(--shu); font-size: 12px; }
.switch { display: flex !important; gap: 8px; align-items: center; font-size: 13px !important; color: var(--ink) !important; }
.switch input { width: 18px; height: 18px; accent-color: var(--ai); }
.pricechips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
.pricechips button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 4px 10px; font: 700 14px var(--f-num); font-variant-numeric: tabular-nums; color: var(--ink); }
.pricechips button[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-soft); color: var(--ai); }
.items { list-style: none; margin: 0; padding: 4px 12px; background: var(--paper); border-radius: 10px; max-height: 200px; overflow: auto; }
.items li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--rule); font-size: 13px; }
.items li:last-child { border-bottom: 0; }
.items li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.items .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.items .x { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 0 4px; }
details summary { font-size: 12px; color: var(--muted); cursor: pointer; }
details pre { white-space: pre-wrap; font-size: 12px; background: var(--paper); border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto; margin: 6px 0 0; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 20; }
</style>

<div class="wrap">
  <header class="top">
    <button class="icon-btn" id="prev" aria-label="前の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1 id="month"></h1>
    <button class="icon-btn" id="next" aria-label="次の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="icon-btn" id="settings" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <div id="notice"></div>

  <section class="summary" aria-label="今月のまとめ">
    <div class="spent">
      <div><div class="label">今月の支出</div><div class="big num" id="sumOut"></div></div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="trio">
      <div><span class="label">収入</span><span class="v num" id="sumIn"></span></div>
      <div><span class="label">収支</span><span class="v num" id="sumNet"></span></div>
    </div>
  </section>

  <div class="section-h"><h2>カテゴリ別</h2></div>
  <section class="cats" id="cats"></section>

  <div class="section-h"><h2>明細</h2><span class="label" id="count"></span></div>
  <section class="ledger" id="ledger"></section>
</div>

<div class="dock">
  <div class="dock-in">
    <label class="btn primary" id="scanBtn" for="file" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>レシートを読み取る</label>
    <button class="btn ghost" id="pasteBtn" aria-label="読み取った文字を貼り付け"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2"/><path d="M9 13l2 2 4-4"/></svg>貼り付け</button>
    <button class="btn ghost" id="addBtn" aria-label="手入力で追加"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>手入力</button>
  </div>
</div>
<input type="file" id="file" accept="image/*" class="vh">
<input type="file" id="csvFile" class="vh" accept=".csv,text/csv,text/comma-separated-values,text/plain,application/vnd.ms-excel">
<div id="sheet"></div>

<script src="vendor/tesseract.min.js"></script>
<script src="parse.js"></script>
<script>
(function () {
"use strict";
var KEY = "kakeibo.v1";
var OUT_CATS = ["食費", "外食", "日用品", "交通", "趣味", "交際", "衣服", "住居", "光熱費", "通信", "医療", "教育", "その他"];
var IN_CATS = ["給料", "バイト", "仕送り", "臨時収入", "その他"];
var WD = ["日", "月", "火", "水", "木", "金", "土"];
var $ = function (id) { return document.getElementById(id); };
var yen = function (n) { return n.toLocaleString("ja-JP"); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- storage (この端末のみ) ---------- */
var storageOk = true;
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
    return null;
  } catch (e) { storageOk = false; return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { storageOk = false; renderNotice(); }
}
function sampleData() {
  var d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1;
  var day = function (n) { return y + "-" + pad(m) + "-" + pad(Math.min(n, d.getDate())); };
  return [
    { type: "in", date: day(1), amount: 82000, cat: "バイト", store: "", memo: "9月分" },
    { type: "out", date: day(1), amount: 54000, cat: "住居", store: "", memo: "家賃" },
    { type: "out", date: day(2), amount: 642, cat: "食費", store: "セブン-イレブン", memo: "", receipt: true },
    { type: "out", date: day(3), amount: 1186, cat: "日用品", store: "マツモトキヨシ", memo: "", receipt: true },
    { type: "out", date: day(4), amount: 450, cat: "外食", store: "すき家", memo: "", receipt: true },
    { type: "out", date: day(5), amount: 3000, cat: "交通", store: "Suica チャージ", memo: "" },
    { type: "out", date: day(5), amount: 2380, cat: "食費", store: "イオン", memo: "", receipt: true }
  ].map(function (e) { e.id = uid(); e.sample = true; return e; });
}
var state = load();
var firstRun = !state;
if (!state) state = { entries: sampleData(), budget: 60000 };
if (!state.entries) state.entries = [];

var cur = (function () { var d = new Date(); return { y: d.getFullYear(), m: d.getMonth() + 1 }; })();

/* ---------- render ---------- */
function monthEntries() {
  var p = cur.y + "-" + pad(cur.m);
  return state.entries.filter(function (e) { return e.date.slice(0, 7) === p; });
}
function renderNotice() {
  var html = "";
  if (!storageOk) html = '<div class="notice">この画面では保存できません。閉じると入力内容は消えます。</div>';
  else if (state.entries.some(function (e) { return e.sample; }))
    html = '<div class="notice"><span>今表示しているのはサンプルです。</span><button id="clearSample">サンプルを消して始める</button></div>';
  $("notice").innerHTML = html;
  var b = $("clearSample");
  if (b) b.onclick = function () { state.entries = state.entries.filter(function (e) { return !e.sample; }); save(); render(); toast("サンプルを消しました"); };
}
function render() {
  var reiwa = cur.y - 2018;
  $("month").innerHTML = '<small>令和' + reiwa + '年</small>' + cur.y + '年' + cur.m + '月';
  var es = monthEntries();
  var out = 0, inc = 0, byCat = {};
  es.forEach(function (e) {
    if (e.type === "in") inc += e.amount;
    else { out += e.amount; byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; }
  });
  $("sumOut").innerHTML = yen(out) + "<span>円</span>";
  $("sumIn").textContent = yen(inc) + "円";
  var net = inc - out;
  $("sumNet").textContent = (net > 0 ? "+" : "") + yen(net) + "円";
  $("sumNet").className = "v num " + (net >= 0 ? "pos" : "neg");

  var b = state.budget || 0;
  if (b > 0) {
    var pct = Math.min(100, out / b * 100), over = out > b;
    $("meter").innerHTML = '<div class="bar' + (over ? " over" : "") + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="meter-row"><span>予算 ' + yen(b) + '円</span><span class="' + (over ? "neg" : "") + '">' +
      (over ? yen(out - b) + "円オーバー" : "残り " + yen(b - out) + "円") + '</span></div>';
  } else {
    $("meter").innerHTML = '<div class="meter-row"><span>月の予算は未設定です</span><button class="link" id="setBudget">予算を決める</button></div>';
    $("setBudget").onclick = openSettings;
  }

  var cats = Object.keys(byCat).sort(function (a, c) { return byCat[c] - byCat[a]; });
  var max = cats.length ? byCat[cats[0]] : 1;
  $("cats").innerHTML = cats.length ? cats.map(function (c) {
    return '<div class="cat-row"><span>' + esc(c) + '</span><div class="bar"><i style="width:' + (byCat[c] / max * 100).toFixed(1) + '%"></i></div><span class="amt num">' + yen(byCat[c]) + '円</span></div>';
  }).join("") : '<p class="hint">支出を記録するとここに内訳が出ます。</p>';

  $("count").textContent = es.length ? es.length + "件" : "";
  if (!es.length) {

  if (f) scanReceipt(f);
});
/* ---------- Claude で読み取る ---------- */
// Web版（claude.ai）: 自分のClaudeアカウントで読む。アプリ版: 設定に入れたAPIキーで読む。
var IS_APP = location.hostname === "appassets.androidplatform.net";
var claudeSample = null, sampleImages = false, sampleMax = 1;
// なぜClaudeが使えないかを記録しておき、設定画面に出す
var aiWhy = IS_APP ? "" : "checking";
if (!IS_APP && window.claude && claude.use) {
  claude.use("sample").then(function (s) {
    if (!s) { aiWhy = "null"; return; }
    return s.limits().then(function (l) {
      if (l && l.images) { claudeSample = s; sampleImages = true; sampleMax = l.images.maxCount || 1; aiWhy = ""; updateScanLabel(); }
      else aiWhy = "noimages";
    }).catch(function () { aiWhy = "limits"; });
  }).catch(function () { aiWhy = "error"; });
} else if (!IS_APP) aiWhy = "noclaude";
function updateScanLabel() {
  var b = $("scanBtn"); if (b) b.lastChild.textContent = aiMode() ? "Claudeで読み取る" : "レシートを読み取る";
}
function aiMode() {
  var ai = state.ai || {};
  if (ai.off) return null;
  if (IS_APP) return ai.key ? "api" : null;
  return sampleImages ? "account" : null;
}
function aiPrompt(parts) {
  return (parts > 1 ? "これは1枚の長い日本のレシートを、上から順に" + parts + "つに分けて撮った画像です（境目は少し重なっています。重なった行を二重に数えないでください）。" : "これは日本のレシート（または領収書）の写真です。") + "読み取って、次の形のJSONだけを返してください。\n" +
    '{"store": "店名（支店名があれば含める）", "date": "YYYY-MM-DD", "total": 税込の支払合計（整数・円）, ' +
    '"items": [{"name": "品名", "price": 金額（整数・円、値引きは負の数）}], "category": "' + OUT_CATS.join("|") + '" のどれか1つ, "note": "読めなかった所など（なければ空文字）"}\n' +
    "ルール: totalは「合計」「お会計」など実際に支払った額（お預り・お釣り・ポイント・小計ではない）。" +
    "令和の年号は西暦に直す（令和8年=2026年）。読めない項目は null。数字はかすれていても前後の文脈（品目の合計と合計欄の一致など）から最も確からしい値を選ぶ。" +
    "categoryは店の種類で決める（コンビニやスーパー=食費、飲食店=外食、ドラッグストアや100円ショップ=日用品）。";
}
function extractJson(t) {
  t = String(t || "");
  var f = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (f) t = f[1];
  var i = t.indexOf("{"), j = t.lastIndexOf("}");
  if (i < 0 || j < i) throw new Error("読み取り結果を解釈できませんでした");
  return JSON.parse(t.slice(i, j + 1));
}
function aiRead(pieces, signal) {
  var mode = aiMode();
  if (mode === "account") {
    var use = pieces.slice(0, sampleMax);
    return Promise.all(use.map(canvasBlob)).then(function (blobs) {
      return claudeSample.json(aiPrompt(blobs.length), { images: blobs, signal: signal, cache: false, modelTier: "complex" });
    });
  }
  // アプリ版：Claude API を直接呼ぶ（キーはこの端末にだけ保存）
  var use2 = pieces.slice(0, 5);
  var content = use2.map(function (c) {
    return { type: "image", source: { type: "base64", media_type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.9).split(",")[1] } };
  });
  content.push({ type: "text", text: aiPrompt(use2.length) });
  return fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal: signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": state.ai.key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: state.ai.model || "claude-sonnet-5-5", max_tokens: 3000, messages: [{ role: "user", content: content }] })
  }).then(function (r) {
    return r.json().then(function (j) {
      if (!r.ok) {
        var m = (j && j.error && j.error.message) || ("HTTP " + r.status);
        if (r.status === 401) m = "APIキーが正しくありません";
        else if (r.status === 429) m = "利用上限に達しました。少し待ってからもう一度";
        else if (r.status === 400 && /credit/i.test(m)) m = "APIのクレジット残高が足りません";
        throw new Error(m);
      }
      return extractJson((j.content || []).map(function (c) { return c.text || ""; }).join(""));
    });
  });
}
function normalizeAi(d) {
  var num = function (v) { var n = parseInt(String(v == null ? "" : v).replace(/[^\d-]/g, ""), 10); return isFinite(n) ? n : null; };
  var items = Array.isArray(d.items) ? d.items.map(function (it) { return { name: String(it && it.name || "").slice(0, 30), price: num(it && it.price) }; })
    .filter(function (it) { return it.name && it.price !== null; }).slice(0, 60) : [];
  var total = num(d.total);
  var date = /^\d{4}-\d{2}-\d{2}$/.test(d.date || "") ? d.date : null;
  return {
    total: total && total > 0 ? total : null, totalSure: !!total, date: date,
    store: d.store ? String(d.store).slice(0, 40) : null,
    category: OUT_CATS.indexOf(d.category) >= 0 ? d.category : null,
    items: items,
    candidates: total ? [total] : [],
    note: d.note ? String(d.note) : ""
  };
}

function scanReceipt(file) {
  var job = { cancelled: false, ctl: window.AbortController ? new AbortController() : null }; ocrAbort = job;
  openForm(null, { auto: {} });
  var msg = function (h) { var el = $("scanMsg"); if (el && !job.cancelled) el.innerHTML = h; };
  $("saveBtn").disabled = true;
  msg('<span>レシートの部分を探しています…</span><div class="bar"><i style="width:8%"></i></div>');
  var mode = aiMode();
  receiptPieces(file, mode === "account" ? sampleMax : mode === "api" ? 5 : 1).then(function (rp) {
    if ($("scanImg")) $("scanImg").src = rp.crop.toDataURL("image/jpeg", 0.6);
    job.rp = rp;
    if (!mode) return ocrLocal(rp.crop, job, msg);
    msg('<span>Claudeが読み取っています…（' + (mode === "account" ? "30秒〜1分" : "10〜30秒") + 'ほど）' + (rp.pieces.length > 1 ? "<br>長いレシートなので" + rp.pieces.length + "つに分けて読んでいます。" : "") + '</span><div class="bar"><i style="width:35%"></i></div>');
    return aiRead(rp.pieces, job.ctl && job.ctl.signal).then(function (d) {
      var p = normalizeAi(d || {});
      if (!p.total && !p.items.length) throw new Error("金額を読み取れませんでした");
      return { p: p, source: "claude", text: JSON.stringify(d, null, 1) };
    }).catch(function (err) {
      if (job.cancelled) throw err;
      var why = err && (err.message || err.code) || "";
      if (err && err.code === "not_granted") why = "Claudeの利用が許可されませんでした";
      else if (err && err.code === "rate_limited") why = "Claudeの利用上限に達しました";
      job.aiError = why;
      return ocrLocal(rp.crop, job, msg);
    });
  }).then(function (res) {
    if (job.cancelled) return;
    applyScan(res, job, msg);
  }).catch(function (err) {
    if (job.cancelled) return;
    msg('<span class="warn">読み取りに失敗しました（' + esc(err && err.message || err) + '）。明るい場所で、レシート全体が写るように撮り直してください。手入力で記録することもできます。</span>');
    if ($("saveBtn")) $("saveBtn").disabled = false;
  });
}

function ocrLocal(src, job, msg) {
  msg('<span>' + (job.aiError ? "Claudeで読めなかったため（" + esc(job.aiError) + "）、端末内で読み取ります…" : "レシートを読み込んでいます…") + '</span><div class="bar"><i style="width:4%"></i></div>');
  return prepImage(src).then(function (pr) {
    return getWorker(function (m) {
      var pct = Math.round((m.progress || 0) * 100);
      var label = m.status === "recognizing text" ? "文字を読み取り中 " + pct + "%" : "読み取りの準備中…";
      msg('<span>' + label + '</span><div class="bar"><i style="width:' + (m.status === "recognizing text" ? 20 + pct * 0.8 : 10) + '%"></i></div>');
    }).then(function (w) {
      // 1回目：ブロック全体として読む（傾いた写真でも右端の金額列を落としにくい）
      return w.setParameters({ tessedit_pageseg_mode: "6" }).then(function () { return w.recognize(pr.canvas); }).then(function (r1) {
        var p1 = KakeiboParse.parseReceipt(r1.data.text || "");
        if (job.cancelled || (p1.total && p1.candidates.length)) return { text: r1.data.text || "", p: p1, source: "local" };
        msg('<span>金額を探しています（もう一度読み取り中）…</span><div class="bar"><i style="width:70%"></i></div>');
        return w.setParameters({ tessedit_pageseg_mode: "4" }).then(function () { return w.recognize(pr.canvas); }).then(function (r2) {
          var p2 = KakeiboParse.parseReceipt(r2.data.text || "");
          var score = function (p) { return (p.total ? 2 : 0) + (p.totalSure ? 2 : 0) + p.candidates.length + p.items.length; };
          return score(p2) > score(p1) ? { text: r2.data.text || "", p: p2, source: "local" } : { text: r1.data.text || "", p: p1, source: "local" };
        });
      });
    });
  });
}

function applyScan(res, job, msg) {
  var p = res.p, text = res.text;
  var auto = {};
  if (p.total) { $("fAmount").value = p.total; auto.total = 1; }
  if (p.date) { $("fDate").value = p.date; auto.date = 1; }
  if (p.store) { $("fStore").value = p.store; auto.store = 1; }
  if (p.category) { var b = document.querySelector('#catpick button[data-c="' + p.category + '"]'); if (b) b.click(); auto.category = 1; }
  ["total", "date", "store", "category"].forEach(function (k) {
    if (!auto[k]) return;
    var lab = { total: "fAmount", date: "fDate", store: "fStore" }[k];
    var el = lab ? document.querySelector('label[for="' + lab + '"]') : document.querySelector("#catpick").previousElementSibling;
    if (el && !el.querySelector(".auto")) el.insertAdjacentHTML("beforeend", ' <span class="auto">自動入力</span>');
  });
  formItems = p.items && p.items.length ? p.items : null;
  drawItems();
  if (res.source === "local") drawPriceChips(p.candidates);
  var notes = [];
  var who = res.source === "claude" ? "Claudeが読み取りました" : "読み取りました";
  if (!p.total) notes.push('<span class="warn">合計金額が見つかりませんでした。' + (res.source === "local" ? "下の金額から選ぶか、" : "") + '入力してください。</span>');
  else if (!p.totalSure) notes.push('<span class="warn">「合計」の行が読めなかったので推測です。違っていたら下の金額から選んでください。</span>');
  else notes.push("<span>" + who + "。内容を確かめて記録してください。</span>");
  if (p.note) notes.push('<span class="hint">メモ：' + esc(p.note) + '</span>');
  if (res.source === "local" && job.aiError) notes.push('<span class="hint">Claudeでは読めませんでした（' + esc(job.aiError) + '）。端末内の読み取り結果です。</span>');
  if (res.source === "local" && !aiMode() && job.rp) notes.push('<span class="hint">うまく読めない時は、Google レンズで文字を読み取って「貼り付け」から入れると正確です。</span>');
  msg(notes.join("") + '<details><summary>' + (res.source === "claude" ? "読み取り結果（データ）を見る" : "読み取ったテキストを見る") + '</summary><pre>' + esc(String(text || "").trim() || "（文字が見つかりませんでした）") + '</pre></details>');
  $("saveBtn").disabled = false;
  if (!p.total) $("fAmount").focus();
}

/* ---------- settings & backup ---------- */
function aiSettingsHtml() {
  var ai = state.ai || {};
  var on = !ai.off;
  var head = '<div class="field"><label>Claudeでレシートを読む</label>';
  if (!IS_APP) {
    return head + '<p class="hint">' + (sampleImages
      ? "かすれた・くしゃくしゃのレシートも、Claudeが読み取ります。あなたのClaudeの利用分を使い、初回だけ許可を求められます。写真は読み取りのためにだけ送られ、記録はこの端末にだけ保存されます。"
      : "この開き方ではClaudeを使えないため、端末内の読み取りになっています。<b>Claudeアプリ</b>の中でこのページを開くと使えます。") + '</p>' +
      (sampleImages ? "" : '<p class="hint">状態：' + ({ noclaude: "Claudeの画面の外で開かれています", "null": "このページからClaudeを呼べません（開き方の制限）", noimages: "この画面では写真をClaudeに送れません", limits: "Claudeの設定を確認できませんでした", error: "Claudeに接続できませんでした", checking: "確認中…（数秒後にもう一度開いてください）" }[aiWhy] || aiWhy) + '</p>') +
      (sampleImages ? '<label class="switch"><input type="checkbox" id="aiOn"' + (on ? " checked" : "") + '> Claudeで読み取る（オフにすると端末内だけで読み取り）</label>' : "") + '</div>';
  }
  return head + '<p class="hint">Anthropic の APIキーを入れると、かすれたレシートもClaudeが読み取ります。料金はAPIの従量課金で、1枚あたり1〜2円ほどです。キーは <b>console.anthropic.com</b> で作れます。写真は読み取りのためにだけ送られ、キーと記録はこの端末にだけ保存されます。</p>' +
    '<input id="aiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-..." value="' + esc(ai.key || "") + '" style="width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px 12px">' +
    '<div class="two"><select id="aiModel" style="border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px 12px">' +
    '<option value="claude-sonnet-5-5"' + (ai.model !== "claude-haiku-4-5-20251001" ? " selected" : "") + '>Sonnet 5.5（正確・おすすめ）</option>' +
    '<option value="claude-haiku-4-5-20251001"' + (ai.model === "claude-haiku-4-5-20251001" ? " selected" : "") + '>Haiku 4.5（速い・安い）</option></select>' +
    '<button class="btn primary" id="aiSave" type="button">保存</button></div>' +
    (ai.key ? '<label class="switch"><input type="checkbox" id="aiOn"' + (on ? " checked" : "") + '> Claudeで読み取る</label>' : "") +
    '<p class="hint" id="aiMsg"></p></div>';
}
function bindAiSettings() {
  var ai = state.ai = state.ai || {};
  if ($("aiOn")) $("aiOn").onchange = function () { ai.off = !this.checked; save(); updateScanLabel(); toast(this.checked ? "Claudeで読み取ります" : "端末内だけで読み取ります"); };
  if ($("aiSave")) $("aiSave").onclick = function () {
    var k = $("aiKey").value.trim();
    if (k && !/^sk-ant-/.test(k)) { $("aiMsg").textContent = "APIキーは「sk-ant-」で始まる文字列です。コピーし直してください。"; return; }
    ai.key = k; ai.model = $("aiModel").value; if (k) ai.off = false;
    save(); updateScanLabel(); $("aiMsg").textContent = k ? "保存しました。次のレシートからClaudeが読み取ります。" : "キーを消しました。端末内で読み取ります。";
  };
}

function openSettings() {
  openSheet(
    '<h3>設定</h3>' +
    aiSettingsHtml() +
    '<hr style="border:0;border-top:1px solid var(--rule);width:100%">' +
    '<div class="field"><label>カード明細の取り込み</label>' +
    '<p class="hint">カード会社のサイトやアプリ（楽天e-NAVI、Vpass、MyJCB など）から明細をCSVでダウンロードし、ここで選んでください。ファイルはこの端末の中だけで読み込みます。</p></div>' +
    '<div class="actions"><label class="btn primary" id="sCard" for="csvFile" role="button" tabindex="0">明細CSVを選ぶ</label></div>' +
    '<hr style="border:0;border-top:1px solid var(--rule);width:100%">' +
    '<div class="field"><label for="sBudget">月の予算（円）</label><div class="amount-in"><span>¥</span><input id="sBudget" inputmode="numeric" value="' + (state.budget || "") + '" placeholder="0 で予算なし"></div></div>' +
    '<div class="actions"><button class="btn primary" id="sSave">予算を保存</button></div>' +
    '<hr style="border:0;border-top:1px solid var(--rule);width:100%">' +
    '<div class="field"><label for="sData">バックアップ（記録はこの端末の中だけに保存されています）</label>' +
    '<textarea id="sData" spellcheck="false" placeholder="ここに書き出したデータを貼り付けると読み込めます"></textarea></div>' +
    '<p class="hint">機種変更の前に「書き出す」でコピーし、メモ帳などに保管してください。</p>' +
    '<div class="actions"><button class="btn ghost" id="sExport">書き出してコピー</button><button class="btn ghost" id="sCsv">CSVでコピー</button><button class="btn ghost" id="sImport">貼り付けた内容を読み込む</button></div>' +
    '<p class="warn" id="sMsg" hidden></p>' +
    '<div class="actions"><button class="btn danger grow" id="sWipe">すべての記録を消す</button><button class="btn plain" id="sClose">閉じる</button></div>' +
    (webVersion ? '<p class="hint">ポケット家計簿 バージョン ' + webVersion + (IS_APP ? "（起動時に自動で更新を確認します）" : "") + '</p>' : "")
  );
  $("sClose").onclick = closeSheet;
  bindAiSettings();
  $("sCard").addEventListener("click", function () { $("csvFile").value = ""; });
  $("sBudget").addEventListener("input", function () { this.value = KakeiboParse.toHalf(this.value).replace(/[^\d]/g, ""); });
  $("sSave").onclick = function () { state.budget = parseInt($("sBudget").value, 10) || 0; save(); render(); toast("予算を保存しました"); };
  function copy(text, okMsg) {
    $("sData").value = text;
    var done = function () { toast(okMsg); };
    var fallback = function () { $("sData").focus(); $("sData").select(); try { document.execCommand("copy"); done(); } catch (e) { say("テキストを長押ししてコピーしてください。"); } };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }
  function say(t) { var el = $("sMsg"); el.textContent = t; el.hidden = false; }
  var real = function () { return state.entries.filter(function (e) { return !e.sample; }); };
  $("sExport").onclick = function () { copy(JSON.stringify({ app: "kakeibo", v: 1, budget: state.budget, entries: real() }), "コピーしました"); };
  $("sCsv").onclick = function () {
    var rows = [["日付", "種類", "カテゴリ", "金額", "店名", "メモ"]].concat(real().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).map(function (e) {
      return [e.date, e.type === "in" ? "収入" : "支出", e.cat, e.amount, e.store, e.memo];
    }));
    copy(rows.map(function (r) { return r.map(function (c) { c = String(c == null ? "" : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(","); }).join("\n"), "CSVをコピーしました");
  };
  $("sImport").onclick = function () {
    try {
      var d = JSON.parse($("sData").value);
      if (!d || !Array.isArray(d.entries)) throw 0;
      var ids = {}; state.entries.forEach(function (e) { ids[e.id] = 1; });
      var added = 0;
      d.entries.forEach(function (e) {
        if (!e || !e.date || !e.amount) return;
        if (!e.id || ids[e.id]) { if (ids[e.id]) return; e.id = uid(); }
        delete e.sample; state.entries.push(e); added++;
      });
      state.entries = state.entries.filter(function (e) { return !e.sample || !added; });
      if (d.budget && !state.budget) state.budget = d.budget;
      save(); render(); say(added + "件を読み込みました。");
    } catch (e) { say("読み込めませんでした。「書き出してコピー」で作ったデータをそのまま貼り付けてください。"); }
  };
  $("sWipe").onclick = function () {
    if (this.dataset.armed) { state.entries = []; save(); render(); closeSheet(); toast("すべて消しました"); }
    else { this.dataset.armed = "1"; this.textContent = "本当にすべて消す"; }
  };
}
$("settings").onclick = openSettings;

/* ---------- card statement CSV import ---------- */
function decodeCsv(buf) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { try { return new TextDecoder("shift_jis").decode(buf); } catch (e2) { return new TextDecoder("utf-8").decode(buf); } }
}
$("csvFile").addEventListener("change", function () {
  var f = this.files && this.files[0];
  if (!f) return;
  f.arrayBuffer().then(function (buf) {
    var res = KakeiboParse.parseCardCsv(decodeCsv(buf));
    var seen = {};
    state.entries.forEach(function (e) { if (e.type === "out") seen[e.date + "|" + e.amount] = (seen[e.date + "|" + e.amount] || 0) + 1; });
    var items = res.items.map(function (it) {
      var k = it.date + "|" + it.amount, dup = !!seen[k];
      if (dup) seen[k]--;
      return { date: it.date, amount: it.amount, store: it.store, cat: KakeiboParse.guessCategory(it.store, "") || "その他", dup: dup, on: !dup };
    });
    showCardImport(items, res.skipped, f.name);
  }).catch(function () { toast("ファイルを開けませんでした"); });
});
function showCardImport(items, skipped, name, from) {
  from = from || "card";
  if (!items.length) {
    openSheet('<h3>カード明細の取り込み</h3><p class="warn">「' + esc(name) + '」から利用明細を見つけられませんでした。カード会社のサイトでCSV形式を選んでダウンロードしたファイルか確かめてください。</p><div class="actions"><button class="btn plain" id="cClose">閉じる</button></div>');
    $("cClose").onclick = closeSheet; return;
  }
  function draw() {
    var on = items.filter(function (i) { return i.on; });
    var sum = on.reduce(function (s, i) { return s + i.amount; }, 0);
    var dups = items.filter(function (i) { return i.dup; }).length;
    openSheet(
      '<h3>' + (from === "claude" ? "Claudeが読んだレシート" : "カード明細の取り込み") + '</h3>' +
      '<p class="hint">' + items.length + '件見つかりました。' + (dups ? dups + '件は同じ日・同じ金額の記録がすでにあるため、外してあります（レシートで記録済みの可能性）。' : "") + (skipped ? "返金・取消の" + skipped + "件は除きました。" : "") + 'チェックした分だけ「支出」として追加します。</p>' +
      '<div class="ledger" style="box-shadow:none;border:1px solid var(--rule);max-height:46vh;overflow:auto">' +
      items.map(function (it, i) {
        return '<label class="row" style="cursor:pointer"><input type="checkbox" data-i="' + i + '"' + (it.on ? " checked" : "") + '>' +
          '<span class="what"><b>' + esc(it.store || "（店名なし）") + '</b><small>' + (+it.date.slice(5, 7)) + '/' + (+it.date.slice(8)) + ' · ' + esc(it.cat) + (it.dup ? ' · <span class="neg">重複の可能性</span>' : "") + '</small></span>' +
          '<span class="amt num">' + yen(it.amount) + '</span></label>';
      }).join("") + '</div>' +
      '<div class="actions"><button class="btn plain grow" id="cClose">やめる</button><button class="btn primary" id="cGo"' + (on.length ? "" : " disabled") + '>' + on.length + '件・' + yen(sum) + '円を追加</button></div>'
    );
    document.querySelectorAll('.panel input[type="checkbox"]').forEach(function (cb) {
      cb.onchange = function () { items[+cb.dataset.i].on = cb.checked; var y = document.querySelector(".panel .ledger").scrollTop; draw(); document.querySelector(".panel .ledger").scrollTop = y; };
    });
    $("cClose").onclick = closeSheet;
    $("cGo").onclick = function () {
      var add = items.filter(function (i) { return i.on; });
      add.forEach(function (i) {
        var e = { id: uid(), type: "out", date: i.date, amount: i.amount, cat: i.cat, store: i.store, memo: "" };
        if (from === "claude") { e.receipt = true; if (i.items && i.items.length) e.items = i.items; } else e.card = true;
        state.entries.push(e);
      });
      state.entries = state.entries.filter(function (e) { return !e.sample; });
      save();
      var last = add.map(function (i) { return i.date; }).sort().pop();
      cur = { y: +last.slice(0, 4), m: +last.slice(5, 7) };
      closeSheet(); render(); toast(add.length + "件を追加しました");
    };
  }
  draw();
}

if (firstRun) save();
updateScanLabel();
render();
})();
</script>
